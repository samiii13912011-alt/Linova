<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linova Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <h2>LINOVA</h2>

        <nav>
            <a href="#" class="active">🏠 داشبورد</a>
            <a href="#">📊 آمار</a>
            <a href="#">⚙️ تنظیمات</a>
        </nav>

    </aside>

    <main class="main-content">

<button id="menuBtn" class="menu-btn">
☰
</button>
        <header>

            <h1>خوش آمدی 👋</h1>

            <p>به پنل مدیریت لینوا خوش آمدید.</p>

            <button id="themeBtn">
                🌙 حالت روشن
            </button>

        </header>
<section class="profile-card">

    <div class="avatar">
        👤
    </div>

    <div class="profile-info">
        <h2>Sam</h2>
        <p>🛡️ Administrator</p>
        <span class="status">🟢 Online</span>
    </div>

</section>
        <section class="cards">

            <div class="card">
                <span>👥</span>
                <h3>کاربران</h3>
                <h2 id="users">0</h2>
            </div>

            <div class="card">
                <span>📈</span>
                <h3>بازدیدها</h3>
                <h2 id="visits">0</h2>
            </div>

            <div class="card">
                <span>🚀</span>
                <h3>وضعیت</h3>
                <strong>فعال</strong>
            </div>

        </section>

<section class="chart-section">

    <h2>📈 آمار هفتگی</h2>

    <div class="chart">

        <div class="bar" style="height:60%">
            <span>شنبه</span>
        </div>

        <div class="bar" style="height:85%">
            <span>یکشنبه</span>
        </div>

        <div class="bar" style="height:45%">
            <span>دوشنبه</span>
        </div>

        <div class="bar" style="height:95%">
            <span>سه‌شنبه</span>
        </div>

        <div class="bar" style="height:70%">
            <span>چهارشنبه</span>
        </div>

        <div class="bar" style="height:55%">
            <span>پنجشنبه</span>
        </div>

        <div class="bar" style="height:100%">
            <span>جمعه</span>
        </div>

    </div>

</section>

    </main>

</div>

<script src="app.js"></script>

</body>

</html>
